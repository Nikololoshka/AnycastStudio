x-app: &app
  build: .
  image: anycast-backend
  env_file: .env
  environment:
    SQLITE_PATH: /data/db.sqlite3
    MEDIA_ROOT: /data/media
    REDIS_URL: redis://redis:6379/0
  volumes:
    - data:/data
  depends_on:
    - redis
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: python -m celery -A config worker -l info

  beat:
    <<: *app
    command: python -m celery -A config beat -l info -s /data/celerybeat-schedule

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
      FRONTEND_IP: ${FRONTEND_IP:?set FRONTEND_IP in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  data:
  caddy:
