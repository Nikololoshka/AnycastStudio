# Host nginx site for the OAuth broker running in Docker on 127.0.0.1:8000.
# Install: copy to /etc/nginx/sites-available/multiposter, symlink into sites-enabled,
# replace auth.example.com, get a certificate (certbot --nginx -d auth.example.com), reload nginx.

# Access log without the query string: the OAuth callback URL contains the one-time code.
log_format multiposter '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    access_log /var/log/nginx/multiposter.access.log multiposter;

    location /multiposter/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx appends the real client IP; the app takes the rightmost entry for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /poll holds the request for up to 25 s.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
